services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: music-bot-lavalink
    restart: unless-stopped
    environment:
      # Read by application.yml through Spring's placeholder syntax, so the
      # password lives in .env rather than in a committed config file.
      - _JAVA_OPTIONS=-Xmx1G
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      # Read by the LavaSrc plugin. Leave any of them unset and that service's
      # links are simply unsupported; nothing else changes.
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - APPLE_MUSIC_TOKEN=${APPLE_MUSIC_TOKEN:-}
      - DEEZER_DECRYPTION_KEY=${DEEZER_DECRYPTION_KEY:-}
    volumes:
      - ./docker/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    ports:
      # Bound to localhost: the node takes a password but has no business being
      # reachable from the internet.
      - '127.0.0.1:2333:2333'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 2333 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Optional. Nothing here needs it — leave DATABASE_URL unset in .env and the
  # bot keeps its playlists, settings, stats and sessions in JSON files instead.
  # Bring it up with `docker compose --profile postgres up -d`.
  postgres:
    image: postgres:16-alpine
    container_name: music-bot-postgres
    restart: unless-stopped
    profiles: [postgres]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-musicbot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-musicbot}
      - POSTGRES_DB=${POSTGRES_DB:-musicbot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to localhost, like the audio node: a database with a default
      # password has no business being reachable from the internet.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-musicbot}']
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: music-bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
      postgres:
        condition: service_healthy
        # So `docker compose up` without the profile does not wait for a
        # database nobody started.
        required: false
    env_file:
      - .env
    environment:
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333

volumes:
  lavalink-plugins:
  postgres-data:
