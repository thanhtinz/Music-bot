server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    # Supplied by docker-compose from LAVALINK_PASSWORD, so no secret is
    # committed here (spec §25).
    password: '${LAVALINK_SERVER_PASSWORD:youshallnotpass}'
    sources:
      # YouTube is served by the youtube-source plugin below rather than the
      # built-in source, which Lavalink 4 no longer maintains.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

  plugins:
    - dependency: 'dev.lavalink.youtube:youtube-plugin:1.13.5'
      repository: 'https://maven.lavalink.dev/releases'
    # Spotify links are read here rather than in the bot: LavaSrc already holds
    # the credentials and the token cache, and a second copy in the bot would be
    # a second thing to keep current.
    - dependency: 'com.github.topi314.lavasrc:lavasrc-plugin:4.7.3'
      repository: 'https://maven.lavalink.dev/releases'

plugins:
  lavasrc:
    sources:
      # Metadata only; the audio comes from whatever `providers` below finds,
      # which is YouTube here. Each of these still needs its own credentials —
      # switched on without them, links come back empty and the bot reports the
      # service as not enabled, which is the truth of it.
      spotify: true
      applemusic: true
      deezer: true
      yandexmusic: false
    spotify:
      # Supplied by docker-compose from the environment, so no secret is
      # committed here (spec §25). Blank means Spotify links stay unsupported.
      clientId: '${SPOTIFY_CLIENT_ID:}'
      clientSecret: '${SPOTIFY_CLIENT_SECRET:}'
      countryCode: 'VN'
      playlistLoadLimit: 3
      albumLoadLimit: 3
    applemusic:
      # A media-api token, read out of the Apple Music web player. Blank and
      # Apple Music links stay unsupported.
      mediaAPIToken: '${APPLE_MUSIC_TOKEN:}'
      countryCode: 'VN'
      playlistLoadLimit: 3
      albumLoadLimit: 3
    deezer:
      # Deezer's tracks are encrypted; this is the key LavaSrc needs to read
      # them. Blank and Deezer links stay unsupported.
      masterDecryptionKey: '${DEEZER_DECRYPTION_KEY:}'
    providers:
      # How LavaSrc looks for playable audio once it knows what the link is.
      - 'ytsearch:"%ISRC%"'
      - 'ytsearch:%QUERY%'

  youtube:
    enabled: true
    # Client order matters: MUSIC and WEBEMBEDDED cope with tracks the plain
    # web client refuses, and ANDROID_VR avoids most age gates.
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

logging:
  level:
    root: INFO
    lavalink: INFO
  file:
    path: ./logs/
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 25MB
